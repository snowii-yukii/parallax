<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPortfolio | Contact</title>
    <!-- External Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Header with Navigation -->
    <header>
        <nav>
            <div class="logo">
                <h2>snowii</h2>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Hero -->
    <main style="background-image: url(images/spaceship-rocket-space-digital-art-4k-wallpaper-uhdpaper.com-274@0@j.jpg);
    background-size: cover; background-position: center;
    background-repeat: no-repeat; background-attachment: fixed;">
        <div class="container">
            <div class="main-text">
                <h1>Contact Me</h1>
                <p>If you have any questions or inquiries, feel free to reach out!</p>
            </div>
        </div>
        <div class="scroll-down"><a href="#next-contact"></a></div>
    </main>

    <!-- Contact Information & Form Section -->
    <section id="next-contact">
        <div class="container">
            <div class="contact-container">
                <!-- Contact Info Text -->
                <div class="contact-text">
                    <div class="section-heading">
                        <h2>Let's Connect!</h2>
                    </div>
                    <div class="section-text">
                        <p>Whether you're looking to collaborate on a project, share feedback, or simply want to say hi, I'd love to hear from you!</p>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="contact-form">
                    <form action="#">
                        <div class="form-group">
                            <label style="margin-top: 2vh;" for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <label style="margin-top: 2vh;" for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Your Email" required>
                        </div>
                        <div class="form-group">
                            <label style="margin-top: 2vh;" for="message">Message</label>
                            <textarea id="message" name="message" rows="5" placeholder="Your Message" required></textarea>
                        </div>
                        <button style="margin-top: 2vh;" type="submit">Send Message</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Global Footer -->
        <footer>
            <div class="footer-icons">
                <a href="https://www.facebook.com/" class="icon-link"><i class="fab fa-facebook"></i></a>
                <a href="https://github.com/snowii-yukii" class="icon-link"><i class="fab fa-github"></i></a>
                <a href="https://www.instagram.com/carameal25/" class="icon-link"><i class="fab fa-instagram"></i></a>
            </div>
            <p>&copy; 2026 snowii</p>
        </footer>
    </section>
</body>

</html>
