<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPortfolio | Gallery</title>
    <!-- External Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Header with Navigation -->
    <header>
        <nav>
            <div class="logo">
                <h2>snowii</h2>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Gallery Hero -->
    <main style="background-image: url(images/solitude-moon-night-5120x2880-22085.jpg);
    background-size: cover; background-position: center;
    background-repeat: no-repeat; background-attachment: fixed;">
        <div class="container">
            <div class="main-text">
                <h1>Gallery</h1>
                <p>Witness the moments that shaped me and the stories I've cherished.</p>
            </div>
        </div>
        <div class="scroll-down"><a href="#next-gallery"></a></div>
    </main>

    <!-- Interactive Photo Grid Section -->
    <section id="next-gallery">
        <div class="gallery-container">
            <!-- Row 1 -->
            <div class="gallery-item">
                <img src="images/lofi-bedroom-night-5120x2880-15300.jpg" alt="Lofi Bedroom">
                <div class="overlay">Lofi Nights</div>
            </div>
            <div class="gallery-item">
                <img src="images/mountain-landscape-5120x2880-24317.jpg" alt="Mountain Landscape">
                <div class="overlay">Mountain Peaks</div>
            </div>
            <div class="gallery-item">
                <img src="images/dandelion-flower-5120x2880-26268.jpg" alt="Dandelion">
                <div class="overlay">Nature's Whisper</div>
            </div>
            
            <!-- Row 2 -->
            <div class="gallery-item">
                <img src="images/IMG_20260421_162124_839.jpg" alt="Gallery Image">
                <div class="overlay">Cherished Moments</div>
            </div>
            <div class="gallery-item">
                <img src="images/skills group.png" alt="Skills Group">
                <div class="overlay">Technical Journey</div>
            </div>
            <div class="gallery-item">
                <img src="images/os-x-mountain-lion-5120x3200-24073.jpg" alt="Mountain Lion">
                <div class="overlay">Mountain Vistas</div>
            </div>

            <!-- Row 3 -->
            <div class="gallery-item">
                <img src="images/gradient 2.png" alt="Artistic Gradients">
                <div class="overlay">Artistic Gradients</div>
            </div>
            <div class="gallery-item">
                <img src="images/gradient1.png" alt="Ethereal Glow">
                <div class="overlay">Ethereal Glow</div>
            </div>
            <div class="gallery-item">
                <img src="images/gradient3&4.png" alt="Spectrum Flow">
                <div class="overlay">Spectrum Flow</div>
            </div>
        </div>

        <!-- Global Footer -->
        <footer>
            <div class="footer-icons">
                <a href="https://www.facebook.com/" class="icon-link"><i class="fab fa-facebook"></i></a>
                <a href="https://github.com/snowii-yukii" class="icon-link"><i class="fab fa-github"></i></a>
                <a href="https://www.instagram.com/carameal25/" class="icon-link"><i class="fab fa-instagram"></i></a>
            </div>
            <p>&copy; 2026 snowii</p>
        </footer>
    </section>
</body>

</html>
